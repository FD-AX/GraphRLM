services:
  postgres:
    image: postgres:16
    container_name: jmlc-metrics-postgres
    environment:
      POSTGRES_DB: jmlc
      POSTGRES_USER: jmlc
      POSTGRES_PASSWORD: jmlc_local
    ports:
      - "55432:5432"
    volumes:
      - jmlc_metrics_postgres:/var/lib/postgresql/data
      - ../postgres/benchmark_metrics.sql:/docker-entrypoint-initdb.d/001_benchmark_metrics.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jmlc -d jmlc"]
      interval: 5s
      timeout: 5s
      retries: 20

  grafana:
    image: grafana/grafana:latest
    container_name: jmlc-metrics-grafana
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_DEFAULT_THEME: light
    ports:
      - "3300:3000"
    volumes:
      - jmlc_metrics_grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  jmlc_metrics_postgres:
  jmlc_metrics_grafana:
